name: Release

# Läuft automatisch bei jedem Push nach master, der bs-fabric.php ändert.
# Erstellt nur dann einen neuen GitHub Release (inkl. Zip mit nur den nötigen
# Dateien, siehe .gitattributes), wenn die Versionsnummer im Plugin-Header
# noch keinen Release hat — kein manuelles Taggen mehr nötig. Ein Push ohne
# Versionserhöhung (Tag existiert schon) tut einfach nichts.
on:
  push:
    branches:
      - master
    paths:
      - "bs-fabric.php"
  # Manueller Auslöser (Reiter "Actions" -> "Release" -> "Run workflow") — z. B.
  # um eine Version nachzuholen, die schon vor diesem Workflow gepusht wurde.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine plugin version
        id: version
        run: |
          VERSION=$(grep -m1 "^ \* Version:" bs-fabric.php | awk '{print $NF}')
          if [ -z "$VERSION" ]; then
            echo "::error::Konnte 'Version:' nicht aus bs-fabric.php lesen."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} existiert schon — keine Versionserhöhung, nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin zip (nur erforderliche Dateien, siehe .gitattributes)
        if: steps.check.outputs.skip == 'false'
        run: |
          git archive --format=zip --prefix=bs-fabric/ -o "bs-fabric-${{ steps.version.outputs.version }}.zip" HEAD

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "bs-fabric-${{ steps.version.outputs.version }}.zip" \
            --target "${{ github.sha }}" \
            --title "bs-fabric ${{ steps.version.outputs.tag }}" \
            --generate-notes
